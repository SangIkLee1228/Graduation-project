# 로컬 개발용 설정. `docker compose up` 시 compose.yaml에 자동으로 합쳐진다.
# 배포 시에는 `docker compose -f compose.yaml up -d`로 이 파일을 제외한다.
services:
  api:
    volumes:
      - ./app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  db:
    ports:
      - "5432:5432"
